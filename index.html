                            <p className="text-slate-500 mb-10">ናይ መወዳእታ ውጽኢትካ ንምርኣይ 10 kr ክትከፍል ኣለካ።</p>
                            <a 
                                href="https://www.paypal.com/ncp/payment/NS9CVF3VQ5ATS"
                                target="_blank"
                                rel="noopener noreferrer"
                                onClick={() => setTimeout(() => setCurrentStep('results'), 3000)}
                                className="block w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl text-xl shadow-xl active:scale-95 transition-all mb-4"
                            >
                                ሕጂ ክፈል (10 kr)
                            </a>
                            <p className="text-[10px] text-slate-400">ምስ ከፈልካ ውጽኢትካ ብቀጥታ ክርኣየካ እዩ።</p>
                        </div>
                    </div>
                );
            }

            if (currentStep === 'results') {
                const score = allQuestions.reduce((acc, q, i) => acc + (userAnswers[i] === q.c ? 1 : 0), 0);
                const passed = score >= (allQuestions.length * 0.8);
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                        <div className="max-w-md w-full bg-white rounded-[3rem] p-12 text-center shadow-2xl">
                            <div className={`w-20 h-20 ${passed ? 'bg-green-500' : 'bg-red-500'} rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg`}>
                                <Icon name={passed ? "CheckCircle" : "XCircle"} size={40} className="text-white" />
                            </div>
                            <h1 className="text-3xl font-black mb-4">{passed ? "እንኳዕ ተሓጐስካ!" : "እንደገና ፈትን"}</h1>
                            <p className="text-5xl font-black text-indigo-600 mb-4">{score} / {allQuestions.length}</p>
                            <p className="text-slate-500 mb-10">{passed ? "ነቲ ፈተና ብዓወት ሓሊፍካዮ ኣለኻ።" : "ንሕልፈት 80% ክትረክብ ኣለካ።"}</p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="w-full bg-slate-900 text-white font-bold py-5 rounded-2xl text-xl shadow-xl active:scale-95 transition-all"
                            >
                                እንደገና ጀምር
                            </button>
                        </div>
                    </div>
                );
            }

            if (currentStep === 'start') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                        <div className="max-w-md w-full bg-white rounded-[3rem] p-12 text-center shadow-2xl">
                            <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-8 shadow-lg">
                                <Icon name="BookOpen" size={40} className="text-white" />
                            </div>
                            <h1 className="text-3xl font-black mb-4">ምሉእ ናይ ቲዮሪ ፈተና</h1>
                            <p className="text-slate-500 mb-10">70 ሕቶታት ምስ ቅልጡፍ AI ምስልታት።</p>
                            <button 
                                onClick={() => setCurrentStep('quiz')} 
                                className="w-full bg-indigo-600 text-white font-bold py-5 rounded-2xl text-xl shadow-xl active:scale-95 transition-all"
                            >
                                ጀምር
                            </button>
                        </div>
                    </div>
                );
            }

            const currentImg = imageCache[currentIdx];

            return (
                <div className="min-h-screen bg-slate-50 p-4 md:p-8 flex flex-col items-center">
                    <div className="max-w-2xl w-full bg-white rounded-[2.5rem] shadow-2xl overflow-hidden border border-slate-200">
                        <div className="image-container aspect-video flex items-center justify-center bg-slate-100">
                            {currentImg ? (
                                <img src={currentImg} className="w-full h-full object-cover fade-in" />
                            ) : (
                                <div className="flex flex-col items-center gap-4">
                                    <div className="loader"></div>
                                    <span className="text-xs font-bold text-indigo-400 uppercase tracking-widest animate-pulse">AI Scene Building...</span>
                                </div>
                            )}
                            <div className="absolute top-4 left-4 bg-indigo-600 px-3 py-1 rounded-full text-[10px] text-white font-black uppercase tracking-widest shadow-lg">
                                Dynamic AI
                            </div>
                        </div>

                        <div className="p-8 md:p-10">
                            <div className="flex items-center gap-3 mb-6">
                                <div className="h-2 flex-1 bg-slate-100 rounded-full overflow-hidden">
                                    <div className="h-full bg-indigo-600 transition-all duration-500" style={{ width: `${((currentIdx + 1) / allQuestions.length) * 100}%` }}></div>
                                </div>
                                <span className="text-xs font-black text-slate-400">{currentIdx + 1}/{allQuestions.length}</span>
                            </div>
                            
                            <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-8 leading-tight">{allQuestions[currentIdx].q}</h2>
                            <div className="grid gap-3">
                                {allQuestions[currentIdx].a.map((opt, i) => (
                                    <button
                                        key={i}
                                        disabled={answerStatus !== null}
                                        onClick={() => setAnswerStatus(i === allQuestions[currentIdx].c ? 'correct' : 'wrong')}
                                        className={`w-full p-5 text-left rounded-2xl border-2 font-bold transition-all text-base ${
                                            answerStatus === null 
                                                ? 'border-slate-50 bg-slate-50 hover:border-indigo-400 hover:bg-white' 
                                                : i === allQuestions[currentIdx].c 
                                                    ? 'border-green-500 bg-green-50 text-green-700' 
                                                    : 'border-slate-50 opacity-40'
                                        }`}
                                    >
                                        {opt}
                                    </button>
                                ))}
                            </div>
                            
                            {answerStatus && (
                                <button 
                                    onClick={() => {
                                        setAnswerStatus(null);
                                        if (currentIdx < allQuestions.length - 1) setCurrentIdx(currentIdx + 1);
                                        else setCurrentStep('payment');
                                    }}
                                    className="mt-8 w-full bg-slate-900 text-white py-5 rounded-2xl font-black flex items-center justify-center gap-2 shadow-xl hover:bg-black transition-colors"
                                >
                                    ዝቕጽል ሕቶ <Icon name="ArrowRight" size={20} />
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
